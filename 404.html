<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada | Jorge Guardiola Tomás</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1B2B41">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
/* Mismas fuentes y colores que la portada. Las rutas son absolutas porque esta página se sirve en cualquier dirección que no exista. */
@font-face { font-family: "Alegreya"; font-style: normal; font-weight: 400 900; font-display: swap; src: url("/fuentes/alegreya-latin-wght-normal.woff2") format("woff2"); }
@font-face { font-family: "Alegreya Sans"; font-style: normal; font-weight: 700; font-display: swap; src: url("/fuentes/alegreya-sans-latin-700-normal.woff2") format("woff2"); }
:root { color-scheme: dark; }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #1B2B41; color: #F6EFE4; font: 400 1.125rem/1.5 "Alegreya", Georgia, "Times New Roman", serif; text-align: center; }
@supports (min-height: 100svh) { body { min-height: 100svh; } }
h1 { margin: 0 0 10px; font: 700 clamp(1.75rem, 7vw, 2.75rem)/1.1 "Alegreya", Georgia, "Times New Roman", serif; text-wrap: balance; }
p { margin: 0 0 24px; }
a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 22px; border-radius: 999px; background: #D3C28F; color: #18211C; font: 700 1rem/1 "Alegreya Sans", "Trebuchet MS", Arial, sans-serif; text-decoration: none; box-shadow: 0 2px 0 rgba(0, 0, 0, .3); }
a:focus-visible { outline: 2.5px solid #F6EFE4; outline-offset: 3px; }
@media (hover: hover) { a:hover { background: #DDD0A9; } }
</style>
</head>
<body>
<main>
  <h1>Este hilo no lleva a ningún sitio.</h1>
  <p>La página que buscas no existe o ha cambiado de dirección.</p>
  <a href="/">Volver a la portada</a>
</main>
</body>
</html>
